# Generated by XPlat IDE from its workflow template. Do not edit: the IDE starts this workflow only while it matches
# the template byte for byte, and rewrites it when the project, scheme, or configuration changes.
# xplat-workflow-version: 3
#
# Archives and signs an App Store build on a GitHub-hosted Mac, at the commit the IDE asked for.
# Repository secrets, created by the IDE just before each build and deleted when it ends:
#   XPLAT_DIST_CERT_P12           base64 of the Apple Distribution certificate + private key (.p12)
#   XPLAT_DIST_CERT_P12_PASSWORD  password of that .p12 (random, new for every build)
#   XPLAT_APPSTORE_PROFILE        base64 of the App Store provisioning profile
# Team ID, bundle ID, and profile UUID are read from the profile itself.
# Upload to TestFlight happens in the IDE with the user's local API key, never here.
name: xplat-build
run-name: XPlat build ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit to build (40 hex characters); must be the head of the chosen branch
        required: true
        type: string
      request_id:
        description: Request ID chosen by XPlat IDE (32 hex characters)
        required: true
        type: string
      build_number:
        description: Build number (CFBundleVersion) chosen by XPlat IDE, 1 to 3 dot-separated integers
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xplat-build
  cancel-in-progress: false

env:
  CONTAINER: '-project'
  PROJECT: 'HelloApp.xcodeproj'
  SCHEME: 'HelloApp'
  CONFIGURATION: 'Release'

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check request
        env:
          COMMIT: ${{ inputs.commit }}
          REQUEST_ID: ${{ inputs.request_id }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be 40 lowercase hex characters"; exit 1; }
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::request_id must be 32 lowercase hex characters"; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^[0-9]{1,18}(\.[0-9]{1,18}){0,2}$ ]] || { echo "::error::build_number must be 1 to 3 dot-separated integers"; exit 1; }
          [ "$GITHUB_SHA" = "$COMMIT" ] || { echo "::error::the branch is at $GITHUB_SHA, not $COMMIT; push again and retry"; exit 1; }
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: xcodebuild -version

      - name: Install signing assets
        env:
          DIST_CERT_P12: ${{ secrets.XPLAT_DIST_CERT_P12 }}
          DIST_CERT_P12_PASSWORD: ${{ secrets.XPLAT_DIST_CERT_P12_PASSWORD }}
          APPSTORE_PROFILE: ${{ secrets.XPLAT_APPSTORE_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$DIST_CERT_P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          PROFILE="$RUNNER_TEMP/app.mobileprovision"
          echo "$APPSTORE_PROFILE" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          plist() { /usr/libexec/PlistBuddy -c "Print $1" "$RUNNER_TEMP/profile.plist"; }
          UUID="$(plist UUID)"
          TEAM_ID="$(plist TeamIdentifier:0)"
          APP_ID="$(plist Entitlements:application-identifier)"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir" && cp "$PROFILE" "$dir/$UUID.mobileprovision"
          done
          {
            echo "PROFILE_UUID=$UUID"
            echo "TEAM_ID=$TEAM_ID"
            echo "BUNDLE_ID=${APP_ID#*.}"
            echo "KEYCHAIN=$KEYCHAIN"
          } >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive "$CONTAINER" "$PROJECT" -scheme "$SCHEME" -configuration "$CONFIGURATION" \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_UUID</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          [ "$(ls "$RUNNER_TEMP"/export/*.ipa | wc -l)" -eq 1 ] || { echo "::error::expected exactly one .ipa"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 1
          if-no-files-found: error

      - name: Report digests
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          echo "xplat-ipa-sha256=$(shasum -a 256 "$RUNNER_TEMP"/export/*.ipa | cut -d ' ' -f 1)"
          echo "xplat-artifact-digest=$ARTIFACT_DIGEST"

      - name: Remove signing assets
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" \
                 "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$RUNNER_TEMP"/*.mobileprovision
